{% load static %}
{% load dragonade_filters %}
{% for f in zfilters %}
<div class="zlist_entry">
    <div id="{{model|lower}}__filter__{{f.param}}__{{f.value|as_filter_value}}" class="zlist_item filter list_action" style="order:-1; text-align:left;"><i
            class="fa fa-eye"></i> {{f.label}}
    </div>
</div>
{% endfor %}
