{% load static %}
{% load dragonade_filters %}
{% for f in zfilters %}
<div class="zlist_entry">
    <div id="{{model|lower}}____filter__{{f.param}}__{{f.value|as_filter_value}}" code="{{f.code}}" title="{{f.param}}={{f.value}} {{f.code}}" class="zlist_item filter list_action {% if f.on %}on{%endif%}" style="order:-1; text-align:left;">
        <i class="fa {%if f.icon%}{{f.icon}}{%else%}fa-eye{%endif%}"></i> {{f.label}}
    </div>
</div>
{% endfor %}
