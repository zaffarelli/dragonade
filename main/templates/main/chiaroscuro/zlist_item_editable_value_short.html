{% load static %}
{% load dragonade_filters%}

<div id="{{i.type}}__{{i.id}}__{{prop}}__value"  srcval="{{val|encoded_z|safe}}" class="zlist_item simple editor interactive_element">
    {% if txt %}
        <span class="txt">{{prop|as_iconz|safe}}{{txt}}</span>
        <span class="val"  style="color:{{i.quality|col_per_quality}};">{{val}}</span>
    {% else %}
        {{val|render_text|safe }}
    {% endif %}
</div>
